# Ship Version 0.2.0 Of A Panel Plugin
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-capstone-030-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-archive"
      description: "Confirms the 0.2.0 archive was built"
      type: "file"
      source: "validation/validate-archive.sh"
    - name: "validate-plugin-loaded"
      description: "Confirms Perses loads only StatusBadge 0.2.0, next to its own plugins"
      type: "file"
      source: "validation/validate-plugin-loaded.sh"
    - name: "validate-schema-enforced"
      description: "Confirms the new unit field is accepted and the schema still enforced"
      type: "file"
      source: "validation/validate-schema-enforced.sh"
    - name: "validate-dashboard"
      description: "Confirms the dashboard status uses the unit field"
      type: "file"
      source: "validation/validate-dashboard.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - node:22.23.4-alpine3.24
      - prom/prometheus:v3.15.1
