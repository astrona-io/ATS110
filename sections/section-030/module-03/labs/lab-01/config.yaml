# Generate A Datasource Plugin And Connect A Query Plugin
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-lab-030-03-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-plugins-declared"
      description: "Confirms the module declares the query plugin StaticSeries and the datasource plugin DemoSource"
      type: "file"
      source: "validation/validate-plugins-declared.sh"
    - name: "validate-datasource-kind"
      description: "Confirms the query plugin points at the datasource kind DemoSource in schema and code"
      type: "file"
      source: "validation/validate-datasource-kind.sh"
    - name: "validate-query-tests"
      description: "Confirms the query schema has valid and invalid tests and test-schemas passes"
      type: "file"
      source: "validation/validate-query-tests.sh"
    - name: "validate-hidden-cases"
      description: "Confirms the query schema accepts and rejects the grader's own cases"
      type: "file"
      source: "validation/validate-hidden-cases.sh"
    - name: "validate-lint"
      description: "Confirms percli plugin lint accepts the module"
      type: "file"
      source: "validation/validate-lint.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - node:22.23.4-alpine3.24
      - prom/prometheus:v3.15.1
