# Constrain And Test The StatusBadge Schema
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-lab-030-02-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-tests-present"
      description: "Confirms at least three valid and three invalid test files, each a complete StatusBadge definition"
      type: "file"
      source: "validation/validate-tests-present.sh"
    - name: "validate-test-schemas"
      description: "Confirms percli plugin test-schemas passes in the module"
      type: "file"
      source: "validation/validate-test-schemas.sh"
    - name: "validate-hidden-cases"
      description: "Confirms the schema accepts and rejects the grader's own cases"
      type: "file"
      source: "validation/validate-hidden-cases.sh"
    - name: "validate-lint"
      description: "Confirms percli plugin lint accepts the module"
      type: "file"
      source: "validation/validate-lint.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - node:22.23.4-alpine3.24
      - prom/prometheus:v3.15.1
