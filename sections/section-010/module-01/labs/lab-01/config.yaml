# Align The Perses Package Versions
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-lab-010-01-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-package-versions"
      description: "Confirms package.json pins the versions that match Perses v0.54.0"
      type: "file"
      source: "validation/validate-package-versions.sh"
    - name: "validate-dependency-tree"
      description: "Confirms npm installed one version of each core Perses package with no problems"
      type: "file"
      source: "validation/validate-dependency-tree.sh"
    - name: "validate-app-served"
      description: "Confirms the rebuilt app is served at app.localtest.me:8081"
      type: "file"
      source: "validation/validate-app-served.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nginx:1.31.8-alpine
      - nicolaka/netshoot:v0.13
      - node:22.23.4-alpine3.24
      - prom/prometheus:v3.15.1
