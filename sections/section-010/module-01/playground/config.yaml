# The Perses npm Packages (PLAYGROUND) — Playground environment
# A sandbox: it spins up, prepares the environment, then stays running for
# free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-playground-010-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and percli, add the CoreDNS names, install Perses and start the module's builder."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
