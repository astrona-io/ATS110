# Rescue A Starter App That Never Built
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-capstone-010-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-package-versions"
      description: "Confirms React 18, ECharts 5.5.0 and the Perses versions in package.json"
      type: "file"
      source: "validation/validate-package-versions.sh"
    - name: "validate-dependency-tree"
      description: "Confirms a clean npm dependency tree without turning peer checks off"
      type: "file"
      source: "validation/validate-dependency-tree.sh"
    - name: "validate-vite-base"
      description: "Confirms Vite builds the app for the root path"
      type: "file"
      source: "validation/validate-vite-base.sh"
    - name: "validate-app-served"
      description: "Confirms nginx serves the page and its JavaScript"
      type: "file"
      source: "validation/validate-app-served.sh"

teardown:
  keepCluster: false
