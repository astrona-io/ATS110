# Embed Two Panels That Query Through Perses
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-110-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm and percli, adds the CoreDNS names, installs Perses and starts the builder"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-110-lab-020-01-setup"
      description: "Creates the starting state that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits for Perses and the builder before the reference solution runs"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-proxy-from-app"
      description: "Confirms queries reach Prometheus through nginx and the Perses proxy"
      type: "file"
      source: "validation/validate-proxy-from-app.sh"
    - name: "validate-bundle"
      description: "Confirms the two panels, their queries and the proxy path are in the built app"
      type: "file"
      source: "validation/validate-bundle.sh"
    - name: "validate-app-served"
      description: "Confirms the rebuilt app is served"
      type: "file"
      source: "validation/validate-app-served.sh"

teardown:
  keepCluster: false
